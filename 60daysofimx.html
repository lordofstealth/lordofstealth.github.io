<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME OVER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303}
body{display:grid;place-items:center;color:#f2eeee;font-family:Impact,"Arial Narrow",sans-serif}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate;background:
 radial-gradient(ellipse at 50% 48%,#260808 0%,#100506 27%,#050405 59%,#020202 100%)}
.scene:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px,transparent 5px);opacity:.35;animation:scan 8s linear infinite;pointer-events:none}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,rgba(0,0,0,.35) 65%,#000 110%);pointer-events:none}
.content{position:relative;z-index:2;text-align:center;padding:24px;width:min(100%,1100px);animation:arrive 1.1s cubic-bezier(.15,.8,.2,1) both}
.kicker{font:600 11px/1.4 Arial,sans-serif;letter-spacing:.75em;color:#a85c5c;margin:0 0 26px 0;opacity:0;animation:fade .7s 1s forwards}
h1{position:relative;margin:0;color:#f3eaea;font-size:clamp(64px,15vw,190px);font-weight:900;line-height:.82;letter-spacing:-.055em;text-transform:uppercase;text-shadow:0 0 8px rgba(255,40,40,.55),0 0 34px rgba(180,0,0,.4),0 9px 0 #360808;animation:flicker 5s 1.3s infinite}
h1:before,h1:after{content:attr(data-text);position:absolute;inset:0;overflow:hidden;opacity:0}
h1:before{color:#ff3030;transform:translateX(-3px);clip-path:inset(18% 0 61% 0);animation:glitchA 4.2s 2s infinite}
h1:after{color:#a6d9d9;transform:translateX(3px);clip-path:inset(66% 0 12% 0);animation:glitchB 3.7s 2.2s infinite}
.rule{height:1px;width:min(390px,62vw);margin:35px auto 25px;background:linear-gradient(90deg,transparent,#8e2525,transparent);box-shadow:0 0 15px #a00;opacity:0;animation:fade .8s 1.45s forwards}
.subtitle{margin:0;color:#e0d5d5;font:700 clamp(16px,3vw,27px)/1 Arial,sans-serif;letter-spacing:.48em;text-transform:uppercase;opacity:0;animation:fade .8s 1.8s forwards;text-shadow:0 0 18px rgba(255,0,0,.35)}
.bottom{position:absolute;z-index:2;bottom:28px;left:0;right:0;text-align:center;color:#5d4141;font:10px Arial,sans-serif;letter-spacing:.48em;opacity:0;animation:fade 1s 2.3s forwards}
.flash{position:absolute;inset:0;z-index:1;background:#e9dede;opacity:0;pointer-events:none;animation:flash 7s 1.7s infinite}
.particle{position:absolute;z-index:1;width:2px;height:2px;background:#ff5a36;box-shadow:0 0 8px 2px rgba(255,44,12,.7);border-radius:50%;left:var(--x);top:var(--y);opacity:0;animation:rise var(--dur) var(--delay) linear infinite}
@keyframes arrive{from{opacity:0;transform:scale(1.12);filter:blur(12px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes fade{to{opacity:1}}
@keyframes flicker{0%,18%,20%,54%,56%,100%{opacity:1}19%,55%{opacity:.72}72%{text-shadow:3px 0 #8e1111,-2px 0 #4b2020,0 0 25px #a00}}
@keyframes glitchA{0%,87%,89%,100%{opacity:0;transform:translateX(0)}88%{opacity:.8;transform:translateX(-7px)}}
@keyframes glitchB{0%,68%,70%,100%{opacity:0;transform:translateX(0)}69%{opacity:.75;transform:translateX(6px)}}
@keyframes flash{0%,88%,89%,100%{opacity:0}88.5%{opacity:.08}}
@keyframes scan{to{transform:translateY(30px)}}
@keyframes rise{0%{opacity:0;transform:translate3d(0,0,0) scale(.5)}15%{opacity:.9}100%{opacity:0;transform:translate3d(var(--drift),-120px,0) scale(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<main class="scene" aria-label="Game over. Your loss.">
  <div class="flash"></div>
  <div class="content">
    <p class="kicker">END OF THE LINE</p>
    <h1 data-text="GAME OVER">GAME<br>OVER</h1>
    <div class="rule"></div>
    <p class="subtitle">YOUR LOSS.</p>
  </div>
  <div class="bottom">CONNECTION TERMINATED</div>
</main>
<script>
const scene=document.querySelector('.scene');
for(let i=0;i<42;i++){
 const p=document.createElement('i');p.className='particle';
 p.style.setProperty('--x',Math.random()*100+'%');
 p.style.setProperty('--y',(55+Math.random()*45)+'%');
 p.style.setProperty('--dur',(4+Math.random()*7)+'s');
 p.style.setProperty('--delay',(-Math.random()*10)+'s');
 p.style.setProperty('--drift',(Math.random()*100-50)+'px');
 scene.appendChild(p);
}
</script>
</body>
</html>
